<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Diri Sendiri</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body {
            min-height:100vh;
            background: url("foto-fahri.jpg") no-repeat center center/cover fixed;
            position:relative;overflow-x:hidden;color:#fff;text-align:center;padding:15px;
        }
        .lapisan {
            position:absolute;inset:0;
            background:rgba(15,25,50,.6);z-index:0;
        }
        /* Partikel jatuh */
        .partikel {
            position:absolute;top:-20px;z-index:2;pointer-events:none;
            animation:jatuh linear forwards;
            font-size:18px;
        }
        .api {filter:drop-shadow(0 0 8px #ff7722) drop-shadow(0 0 15px #ff4400);}
        .es {filter:drop-shadow(0 0 8px #aaddff) drop-shadow(0 0 15px #66ccff);}
        .teks-fahri {
            font-family:Georgia,Copperplate,serif;font-weight:bold;font-style:italic;
            color:#ffdd22;text-shadow:0 0 6px #ff6600,0 0 12px #ff2200,1px 1px 2px #000;
        }
        @keyframes jatuh {to{transform:translateY(105vh) rotate(35deg);opacity:.7;}}

        /* Layar */
        .layar {position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:15px;background:rgba(20,35,70,.85);transition:opacity .4s ease,visibility .4s ease;}
        .layar.sembunyi {opacity:0;visibility:hidden;}
        .layar.aktif {opacity:1;visibility:visible;}

        /* Tombol BIRU MENYALA */
        .tombol {
            position:relative;border:none;padding:12px 28px;font-size:1rem;border-radius:50px;
            cursor:pointer;transition:transform .12s ease;margin:12px 6px 22px;
            z-index:10;outline:none;
            background:linear-gradient(45deg,#1a5ccc,#2a88ee);color:#fff;
            box-shadow:0 0 20px rgba(50,130,255,.55);
        }
        .tombol:active {transform:scale(.92);}
        .tombol::before {
            content:"";position:absolute;inset:-4px;border-radius:50px;
            background:radial-gradient(circle,#77bbff,#2a77ee,transparent 70%);
            opacity:.7;filter:blur(4px);animation:nyalaBiru .8s infinite alternate;z-index:-1;
            pointer-events:none;
        }
        @keyframes nyalaBiru {from{opacity:.6;transform:scale(1);}to{opacity:.9;transform:scale(1.05);}}
        /* Tetes darah */
        .tetes {position:absolute;left:25%;bottom:-12px;width:6px;height:10px;background:linear-gradient(#900,#f22);border-radius:0 0 6px 6px;filter:blur(.5px);animation:darah 1.2s infinite ease-in;pointer-events:none;}
        .tetes:nth-child(2){left:50%;animation-delay:.3s;}
        .tetes:nth-child(3){left:75%;animation-delay:.6s;}
        @keyframes darah {0%{height:10px;opacity:.9;bottom:-12px;}70%{height:14px;opacity:.7;}100%{height:2px;opacity:0;bottom:-30px;}}

        .tombol-merah {background:linear-gradient(45deg,#900,#d22);box-shadow:0 0 18px rgba(220,50,50,.45);}
        .tombol-merah::before {background:radial-gradient(circle,#ff7777,#dd2222,transparent 70%);animation-name:nyalaApiMerah;}
        @keyframes nyalaApiMerah {from{opacity:.6;transform:scale(1);}to{opacity:.9;transform:scale(1.05);}}

        .card {background:rgba(40,60,100,.75);backdrop-filter:blur(8px);padding:20px;border-radius:18px;border:1px solid rgba(100,180,255,.4);width:min(330px,95%);}
        .tanya {color:#cce6ff;font-size:1.1rem;margin-bottom:8px;line-height:1.5;}
        .keterangan-tambahan {color:#b3d8ff;font-size:.95rem;margin-bottom:15px;line-height:1.4;}
        .jawab {width:100%;padding:11px;font-size:1rem;border-radius:8px;border:none;background:#ffffff;color:#002255;margin-bottom:10px;outline:none;}
        .hasil {margin-top:10px;color:#e0eeff;min-height:24px;font-weight:500;}
        .pesan-merah {color:#ff4444;font-weight:bold;transition:opacity .3s;}
        .pesan-hijau {color:#44ff66;font-weight:bold;transition:opacity .3s;}
        .teks-pesan {color:#e6eeff;font-size:1.1rem;line-height:1.6;margin:15px 0;}

        .wadah-puzzle {display:grid;grid-template-columns:repeat(3,76px);gap:3px;margin:10px auto;justify-content:center;position:relative;}
        .tempat-kosong {width:76px;height:76px;border-radius:4px;border:2px dashed rgba(180,210,255,.6);background:rgba(25,45,90,.6);display:flex;align-items:center;justify-content:center;font-size:.8rem;}
        .keping {width:76px;height:76px;border-radius:4px;background:url("foto-puzzle.png") center/240px no-repeat;cursor:grab;box-shadow:0 0 4px rgba(0,0,0,.25);}
    </style>
</head>
<body>
    <div class="lapisan"></div>

    <script>
        // Suara klik
        function bunyiKlik(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(500,a.currentTime+.08);g.gain.setValueAtTime(.4,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.12);o.start();o.stop(a.currentTime+.12);}catch(e){}}
        // Partikel
        setInterval(()=>{const e=document.createElement('div');e.className='partikel';let r=Math.random();e.className+=r<.35?' api':r<.7?' es':' teks-fahri';e.innerText=r<.35?'🔥':r<.7?'❄️':'fahri';e.style.left=Math.random()*100+'%';e.style.fontSize=(Math.random()*18+12)+'px';e.style.animationDuration=(Math.random()*4.5+2)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),7000);},200);
        // Tambah tetes darah otomatis
        document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.tombol').forEach(b=>{for(let i=0;i<3;i++){const t=document.createElement('span');t.className='tetes';b.appendChild(t);}}));

        // Hapus pesan otomatis 3 detik
        function pesanSementara(el, teks, kelas){
            el.innerHTML = `<span class="${kelas}">${teks}</span>`;
            setTimeout(()=>el.innerHTML="",3000);
        }
    </script>

    <!-- LAYAR UTAMA -->
    <div id="layarAwal" class="layar aktif">
        <p>pencet buka, nek ora tak pancal</p>
        <button class="tombol" onclick="bukaAwal();bunyiKlik();">Buka</button>
    </div>

    <!-- LAYAR NAMA -->
    <div id="layarNama" class="layar sembunyi">
        <div class="card">
            <div class="tanya">Nama mu sopo?</div>
            <input type="text" id="inputNama" class="jawab" placeholder="Ketik namamu...">
            <div class="hasil" id="hasilNama"></div>
            <button class="tombol" onclick="lanjutNama();bunyiKlik();">Lanjut</button>
        </div>
    </div>

    <!-- LAYAR TANYA -->
    <div id="layarTanya" class="layar sembunyi">
        <div class="card">
            <div class="tanya" id="teksTanya"></div>
            <div class="keterangan-tambahan">fahri seng gagah perkoso, sopan, baik, lan suka menolong iki loh</div>
            <input type="text" id="inputTanya" class="jawab" placeholder="Jawab: iya/kenal / ga/tidak/ora">
            <div class="hasil" id="hasilTanya"></div>
            <button class="tombol" onclick="cekJawab();bunyiKlik();">Kirim Jawaban</button>
        </div>
    </div>

    <!-- LAYAR JIKA TIDAK KENAL -->
    <div id="layarTidakKenal" class="layar sembunyi">
        <div class="card">
            <div class="teks-pesan">yowes nek ora kenal, cari tau sek sono, mengko mrene maneh</div>
            <button class="tombol tombol-merah" onclick="window.open('','_self');window.close();bunyiKlik();">Tutup / Metu</button>
        </div>
    </div>

    <!-- LAYAR TEBAK -->
    <div id="layarTebak" class="layar sembunyi">
        <div class="card">
            <div class="tanya">Nama lengkap ku sopo?</div>
            <input type="text" id="inputTebak" class="jawab" placeholder="Ketik jawabanmu...">
            <div class="hasil" id="hasilTebak"></div>
            <button class="tombol" onclick="cekTebak();bunyiKlik();">Kirim Jawaban</button>
        </div>
    </div>

    <!-- LAYAR PUZZLE -->
    <div id="layarPuzzle" class="layar sembunyi">
        <div class="card">
            <div class="tanya">Susun potongan gambar dadi pas kabeh!</div>
            <div class="wadah-puzzle" id="puzzle"></div>
            <div class="hasil" id="pesanPuzzle"></div>
            <div id="tmbSelesai"></div>
        </div>
    </div>

    <script>
        let namaPengguna = "";

        function bukaAwal(){
            layarSembunyiSemua();
            document.getElementById('layarNama').classList.add('aktif');
        }

        function lanjutNama(){
            const v = document.getElementById('inputNama').value.trim();
            if(!v) return document.getElementById('hasilNama').textContent = "Isi dulu namamu ya!";
            namaPengguna = v;
            layarSembunyiSemua();
            document.getElementById('teksTanya').innerText = `Haii ${namaPengguna}, koe kenal Fahri rak??`;
            document.getElementById('layarTanya').classList.add('aktif');
        }

        function cekJawab(){
            const j = document.getElementById('inputTanya').value.trim().toLowerCase();
            if(["ga","tidak","ora","nggak"].includes(j)){
                layarSembunyiSemua();
                document.getElementById('layarTidakKenal').classList.add('aktif');
            }else if(["iya","kenal","yaa","iyya"].includes(j)){
                layarSembunyiSemua();
                document.getElementById('layarTebak').classList.add('aktif');
            }else{
                document.getElementById('hasilTanya').textContent = "Jawab dengan jelas ya!";
            }
        }

        function cekTebak(){
            const j = document.getElementById('inputTebak').value.trim().toLowerCase();
            if(j === "fahri zainul umam"){
                layarSembunyiSemua();
                bukaPuzzle();
                document.getElementById('layarPuzzle').classList.add('aktif');
            }else{
                document.getElementById('hasilTebak').innerHTML = `<br>Salah, coba lagi ya<br><br><button class="tombol tombol-merah" onclick="cekTebak();bunyiKlik();">Coba Lagi</button>`;
                setTimeout(()=>document.querySelectorAll('#hasilTebak .tombol').forEach(b=>{for(let i=0;i<3;i++){const t=document.createElement('span');t.className='tetes';b.appendChild(t);}}),50);
            }
        }

        function layarSembunyiSemua(){
            document.querySelectorAll('.layar').forEach(l=>{l.classList.remove('aktif');l.classList.add('sembunyi');});
        }

        // Puzzle dengan pesan merah/hijau & gambar PNG
        let kepingTarik = null;
        const gambarPuzzle = new Image();
        gambarPuzzle.src = "foto-puzzle.png";
        gambarPuzzle.onerror = function(){
            alert("Gambar foto-puzzle.png tidak ditemukan! Pastikan ada di folder yang sama.");
        };

        function bukaPuzzle(){
            const p = document.getElementById('puzzle');
            const pesanBox = document.getElementById('pesanPuzzle');
            p.innerHTML = ""; pesanBox.innerHTML = "";
            let urut = [0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5);
            // Tempat kosong
            for(let i=0;i<9;i++){
                const t = document.createElement('div');
                t.className='tempat-kosong';t.dataset.urutan=i;
                t.addEventListener('dragover',e=>e.preventDefault());
                t.addEventListener('drop',e=>{
                    e.preventDefault();
                    if(!kepingTarik) return;
                    if(t.children.length>0){
                        pesanSementara(pesanBox, "ruang sudah di isi", "pesan-merah");
                        return;
                    }
                    if(t.dataset.urutan === kepingTarik.dataset.urutan){
                        t.appendChild(kepingTarik);
                        pesanSementara(pesanBox, "okehh", "pesan-hijau");
                        cekSelesai();
                    }else{
                        pesanSementara(pesanBox, "belum pas, coba lagi", "pesan-merah");
                    }
                });
                p.appendChild(t);
            }
            // Keping acak
            urut.forEach(u=>{
                const k = document.createElement('div');
                k.className='keping';k.draggable=true;k.dataset.urutan=u;
                k.style.backgroundPosition = `${-(u%3)*76}px ${-Math.floor(u/3)*76}px`;
                k.addEventListener('dragstart',()=>kepingTarik=k);
                k.addEventListener('dragend',()=>kepingTarik=null);
                p.appendChild(k);
            });
        }

        function cekSelesai(){
            const semua = Array.from(document.querySelectorAll('.tempat-kosong')).every(t=>t.children.length>0);
            if(semua){
                document.getElementById('pesanPuzzle').innerHTML = "<br>✅ Puzzle wis rampung kabeh!";
                document.getElementById('tmbSelesai').innerHTML = `<br><button class="tombol tombol-merah" onclick="window.open('','_self');window.close();bunyiKlik();">✅ Selesai / Metu</button>`;
                setTimeout(()=>document.querySelectorAll('#tmbSelesai .tombol').forEach(b=>{for(let i=0;i<3;i++){const t=document.createElement('span');t.className='tetes';b.appendChild(t);}}),50);
            }
        }
    </script>
</body>
</html>
